name: blocs_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  go_router: ^18.0.2
  random_name_generator: ^1.5.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Fuerza a usar una versión de geolocator_android que ya NO usa
# la API v1 de embedding (PluginRegistry.Registrar), eliminada en Flutter 3.29+.
dependency_overrides:
  geolocator_android: ^5.2.1

flutter:
  uses-material-design: true
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
